<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Primeira configuração · Comanda</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="top"><div class="brand"><img src="/brand-logo.webp" alt="Comanda por Varthex"><span>Prepare seu estabelecimento</span></div><div class="top-actions"><span class="prototype">Protótipo para validação</span><button id="theme" class="theme-button" aria-label="Alternar tema">Tema escuro</button></div></header>
<div class="workspace"><aside class="rail"><div class="checkout-progress"><div class="progress-caption"><label for="setup-progress">Progresso da configuração</label><span><strong id="progress-percent">0%</strong><span id="progress-count">0 de 7 etapas</span></span></div><progress id="setup-progress" max="7" value="0" aria-label="Progresso da configuração"></progress></div><nav aria-label="Etapas da configuração" id="steps"></nav><div class="draft"><span class="status-dot"></span><span id="draft-status" role="status">Rascunho neste navegador</span></div><button class="text-button" id="restart">Recomeçar simulação</button></aside><main id="main" tabindex="-1"></main></div>
<footer class="footer"><div class="footer-inner"><button id="back" class="button secondary">Voltar</button><span class="step-progress" id="progress"></span><div class="footer-actions"><button id="skip" class="button secondary">Configurar depois</button><button id="next" class="button primary">Continuar</button></div></div></footer>
<dialog id="restart-dialog"><h2>Recomeçar a simulação?</h2><p>O rascunho deste protótipo será substituído. Os dados do aplicativo não serão alterados.</p><div class="dialog-actions"><button class="button secondary" id="keep">Continuar de onde parei</button><button class="button primary" id="confirm-restart">Recomeçar</button></div></dialog>
<script type="module" src="app.js"></script></body></html>
