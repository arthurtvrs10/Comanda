  "components": {
    "securitySchemes": {
      "sessao": {
        "type": "apiKey",
        "in": "cookie",
        "name": "sessao"
      }
    },
    "schemas": {
      "Abrir": {
        "type": "object",
        "properties": {
          "numero": {
            "type": "integer"
          },
          "mesa": {
            "type": "integer"
          },
          "nome": {
            "type": "string"
          },
          "tipo": {
            "type": "string",
            "enum": [
              "LOCAL_MESA",
              "SALAO",
              "BALCAO",
              "PARA_LEVAR",
              "DELIVERY"
            ]
          }
        },
        "required": [
          "numero",
          "tipo"
        ]
      },
      "Item": {
        "type": "object",
        "properties": {
          "produtoId": {
            "type": "string"
          },
          "quantidade": {
            "type": "string",
            "example": "0.250"
          }
        },
        "required": [
          "produtoId",
          "quantidade"
        ]
      },
      "Receber": {
        "type": "object",
        "properties": {
          "forma": {
            "type": "string",
            "enum": [
              "DINHEIRO",
              "PIX",
              "DEBITO",
              "CREDITO"
            ]
          },
          "aplicadoCentavos": {
            "type": "integer"
          },
          "recebidoCentavos": {
            "type": "integer"
          }
        },
        "required": [
          "forma",
          "aplicadoCentavos"
        ]
      },
      "Comanda": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "numero": {
            "type": "integer"
          },
          "versao": {
            "type": "integer"
          },
          "status": {
            "type": "string"
          },
          "totalCentavos": {
            "type": "integer"
          },
          "saldoCentavos": {
            "type": "integer"
          }
        },
        "required": [
          "id",
          "numero",
          "versao",
          "status",
          "totalCentavos",
          "saldoCentavos"
        ]
      },
      "Produto": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "nome": {
            "type": "string"
          },
          "unidade": {
            "type": "string"
          },
          "precoCentavos": {
            "type": "integer"
          }
        },
        "required": [
          "id",
          "nome",
          "unidade",
          "precoCentavos"
        ]
      },
      "Venda": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "comandaId": {
            "type": "string"
          },
          "totalCentavos": {
            "type": "integer"
          }
        },
        "required": [
          "id",
          "comandaId",
          "totalCentavos"
        ]
      },
      "Erro": {
        "type": "object",
        "properties": {
          "codigo": {
            "type": "string"
          },
          "mensagem": {
            "type": "string"
          }
        },
        "required": [
          "codigo",
          "mensagem"
        ]
      }
    }
  }
